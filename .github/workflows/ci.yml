name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Build the image
        run: docker build -t nav-downloader:ci .
