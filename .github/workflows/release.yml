# On a version tag (v1.2.3): build for amd64 + arm64 and push to GitHub Container
# Registry, and to Docker Hub too once the repository has two secrets:
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub access token, not your password).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image names
        id: names
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nav-downloader"
          images="$ghcr"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            images="$images"$'\n'"docker.io/${DOCKERHUB_USERNAME,,}/nav-downloader"
            echo "dockerhub=yes" >> "$GITHUB_OUTPUT"
          fi
          echo "ghcr=$ghcr" >> "$GITHUB_OUTPUT"
          { echo "images<<EOF"; echo "$images"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.names.outputs.dockerhub == 'yes'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: IMAGE_NAME=${{ steps.names.outputs.ghcr }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
